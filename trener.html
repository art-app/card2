document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

der:none;background:none;color:inherit;}\n  ::selection{background:var(--primary-soft);}\n\n  .app{\n    display:flex;flex-direction:column;\n    min-height:100vh;min-height:100dvh;\n    max-width:660px;margin:0 auto;\n    position:relative;\n  }\n\n  /* ===== TOP BAR ===== */\n  .topbar{\n    position:sticky;top:0;z-index:20;\n    background:color-mix(in srgb, var(--bg) 78%, transparent);\n    backdrop-filter:saturate(1.4) blur(14px);\n    -webkit-backdrop-filter:saturate(1.4) blur(14px);\n    border-bottom:1px solid var(--line);\n    padding:calc(11px + env(safe-area-inset-top,0px)) 16px 11px;\n  }\n  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}\n  .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;}\n  .brand .t{font-size:15.5px;font-weight:800;letter-spacing:-.01em;}\n  .brand .s{font-size:11.5px;font-weight:500;color:var(--ink-faint);letter-spacing:.01em;\n    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}\n  .tools{display:flex;gap:8px;flex:none;}\n  .icon-btn{\n    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;\n    background:var(--card);border:1px solid var(--line-strong);color:var(--ink-soft);\n    box-shadow:var(--sh-sm);transition:.16s ease;\n  }\n  .icon-btn:hover{color:var(--primary);border-color:#c7c4f4;transform:translateY(-1px);}\n  .icon-btn:active{transform:scale(.93);}\n  .icon-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:var(--sh-pop);}\n  .icon-btn svg{width:18px;height:18px;}\n\n  .ptrack{height:6px;border-radius:99px;background:#dcdfeb;overflow:hidden;margin-top:11px;}\n  .ptrack > i{display:block;height:100%;width:0;border-radius:99px;\n    background:linear-gradient(90deg,#7b74f0,var(--primary));transition:width .4s cubic-bezier(.4,0,.1,1);}\n\n  /* ===== STAGE ===== */\n  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 24px;}\n  #stage{position:relative;}\n\n  .card{\n    background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);\n    box-shadow:var(--sh-card);padding:24px 22px 22px;position:relative;\n    animation:rise .42s cubic-bezier(.2,.7,.2,1) both;\n  }\n  @keyframes rise{from{transform:translateY(14px) scale(.99);}to{transform:none;}}\n  .card.from-left{animation:slideL .34s cubic-bezier(.2,.7,.2,1) both;}\n  .card.from-right{animation:slideR .34s cubic-bezier(.2,.7,.2,1) both;}\n  @keyframes slideL{from{transform:translateX(36px);}to{transform:none;}}\n  @keyframes slideR{from{transform:translateX(-36px);}to{transform:none;}}\n  @keyframes pop{0%{transform:scale(.985);}45%{transform:scale(1.012);}100%{transform:scale(1);}}\n  @keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-8px);}40%,60%{transform:translateX(8px);}}\n  .card.fb-good{animation:pop .42s ease;}\n  .card.fb-bad{animation:shake .5s cubic-bezier(.36,.07,.19,.97);}\n\n  .qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}\n  .qnum{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--primary);}\n  .qnum .dot{width:7px;height:7px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);}\n  .qtype{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);\n    background:#f1f2f8;border-radius:99px;padding:5px 11px;white-space:nowrap;}\n  .qtext{font-size:20px;line-height:1.34;font-weight:700;letter-spacing:-.01em;margin:0 0 18px;text-wrap:pretty;}\n  .qtext .poem{display:block;font-size:15.5px;font-weight:500;font-style:italic;color:var(--ink-soft);\n    margin-top:14px;background:var(--primary-soft2);border-left:3px solid #b9b5f3;border-radius:0 10px 10px 0;padding:11px 14px;}\n\n  /* ===== MC ===== */\n  .opt{\n    display:flex;gap:13px;align-items:center;width:100%;text-align:left;\n    border:1.5px solid var(--line-strong);background:var(--card);border-radius:var(--r-ctrl);\n    padding:15px 16px;margin-bottom:11px;font-size:15.5px;font-weight:500;line-height:1.4;\n    min-height:58px;transition:.15s ease;box-shadow:var(--sh-sm);\n  }\n  .opt:hover:not(:disabled){border-color:#bcb8f2;background:var(--primary-soft2);}\n  .opt:active:not(:disabled){transform:scale(.99);}\n  .opt .mark{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;\n    font-size:14px;font-weight:800;color:var(--primary);background:var(--primary-soft);transition:.15s;}\n  .opt.correct{border-color:var(--correct-line);background:var(--correct-bg);}\n  .opt.wrong{border-color:var(--wrong-line);background:var(--wrong-bg);}\n  .opt.correct .mark{background:var(--correct);color:#fff;}\n  .opt.wrong .mark{background:var(--wrong);color:#fff;}\n  .opt:disabled{cursor:default;}\n  .opt .res{margin-left:auto;flex:none;font-weight:800;font-size:17px;}\n  .opt.correct .res{color:var(--correct);}\n  .opt.wrong .res{color:var(--wrong);}\n\n  /* ===== MATCH / CATEGORIZE ===== */\n  .row{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}\n  .row .lbl{font-size:15px;font-weight:600;line-height:1.4;display:flex;gap:9px;align-items:flex-start;}\n  .row .lbl .tag{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;\n    font-size:12.5px;font-weight:800;color:var(--primary);background:var(--primary-soft);margin-top:1px;}\n  .selwrap{position:relative;}\n  .selwrap::after{content:\"\";position:absolute;right:15px;top:50%;width:9px;height:9px;\n    border-right:2px solid var(--ink-faint);border-bottom:2px solid var(--ink-faint);\n    transform:translateY(-65%) rotate(45deg);pointer-events:none;}\n  select{\n    font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--card);\n    border:1.5px solid var(--line-strong);border-radius:var(--r-ctrl);padding:14px 38px 14px 14px;\n    width:100%;min-height:52px;appearance:none;-webkit-appearance:none;box-shadow:var(--sh-sm);transition:.15s;\n  }\n  select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}\n  .row.ok select{border-color:var(--correct-line);background:var(--correct-bg);}\n  .row.no select{border-color:var(--wrong-line);background:var(--wrong-bg);}\n  .row.ok .selwrap::after,.row.no .selwrap::after{opacity:.4;}\n\n  /* ===== SEQUENCE ===== */\n  .seq-hint{font-size:13px;color:var(--ink-soft);margin:0 0 13px;display:flex;gap:7px;align-items:flex-start;line-height:1.4;}\n  .seq-hint svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--primary);}\n  .seq-pool,.seq-build{display:flex;flex-direction:column;gap:10px;}\n  .seq-build{min-height:4px;margin-bottom:10px;}\n  .seq-divider{height:1px;background:var(--line);margin:4px 0 14px;position:relative;}\n  .seq-divider span{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--card);\n    padding:0 12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);}\n  .chip{\n    display:flex;gap:13px;align-items:center;border:1.5px solid var(--line-strong);background:var(--card);\n    border-radius:var(--r-ctrl);padding:14px 15px;font-size:15px;font-weight:500;text-align:left;width:100%;\n    min-height:56px;transition:.15s;box-shadow:var(--sh-sm);line-height:1.38;\n  }\n  .chip:hover{border-color:#bcb8f2;background:var(--primary-soft2);}\n  .chip:active{transform:scale(.99);}\n  .chip .ord{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;\n    font-size:14px;font-weight:800;color:#fff;background:var(--primary);}\n  .chip.pool .ord{background:#eceaff;color:var(--primary);font-size:18px;}\n  .chip.ok{border-color:var(--correct-line);background:var(--correct-bg);}\n  .chip.no{border-color:var(--wrong-line);background:var(--wrong-bg);}\n  .chip.ok .ord{background:var(--correct);}\n  .chip.no .ord{background:var(--wrong);}\n\n  /* ===== FILL ===== */\n  .fill-in{width:100%;font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--card);\n    border:1.5px solid var(--line-strong);border-radius:var(--r-ctrl);padding:15px 16px;margin-bottom:11px;\n    min-height:54px;box-shadow:var(--sh-sm);transition:.15s;}\n  .fill-in::placeholder{color:var(--ink-faint);font-weight:400;}\n  .fill-in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}\n  .fill-in.ok{border-color:var(--correct-line);background:var(--correct-bg);}\n  .fill-in.no{border-color:var(--wrong-line);background:var(--wrong-bg);}\n\n  /* ===== verdict / answer ===== */\n  .verdict{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px;\n    margin:18px 0 0;padding:9px 15px 9px 11px;border-radius:99px;animation:vin .34s cubic-bezier(.2,.8,.2,1) both;}\n  @keyframes vin{from{transform:scale(.85);}to{transform:none;}}\n  .verdict.good{color:var(--correct);background:var(--correct-bg);}\n  .verdict.bad{color:var(--wrong);background:var(--wrong-bg);}\n  .verdict .vico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;}\n  .verdict.good .vico{background:var(--correct);}\n  .verdict.bad .vico{background:var(--wrong);}\n  .verdict .vico svg{width:14px;height:14px;}\n\n  .answerbox{border-top:1px solid var(--line);margin-top:18px;padding-top:16px;animation:fade .35s ease both;}\n  @keyframes fade{from{transform:translateY(-5px);}to{transform:none;}}\n  .answerbox h4{display:inline-flex;align-items:center;gap:7px;margin:0 0 9px;font-size:12px;font-weight:800;\n    letter-spacing:.06em;text-transform:uppercase;color:var(--primary);}\n  .answerbox h4 svg{width:14px;height:14px;}\n  .answerbox p{margin:0 0 9px;font-size:14.5px;line-height:1.55;color:var(--ink-soft);}\n  .answerbox ul{margin:8px 0 4px;padding-left:0;list-style:none;}\n  .answerbox li{margin-bottom:9px;font-size:14.5px;line-height:1.5;color:var(--ink-soft);\n    padding-left:20px;position:relative;}\n  .answerbox li::before{content:\"\";position:absolute;left:3px;top:8px;width:6px;height:6px;border-radius:50%;\n    background:#c5c1f0;}\n  .answerbox .strong{color:var(--ink);font-weight:700;}\n\n  /* ===== inline action buttons (check / reveal / known) ===== */\n  .btn{\n    display:inline-flex;align-items:center;justify-content:center;gap:8px;\n    border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink);\n    padding:13px 20px;border-radius:13px;font-size:15px;font-weight:700;\n    min-height:50px;transition:.16s ease;box-shadow:var(--sh-sm);\n  }\n  .btn:hover{border-color:#c2bef3;transform:translateY(-1px);}\n  .btn:active{transform:scale(.98);}\n  .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:var(--sh-pop);}\n  .btn.primary:hover{background:var(--primary-deep);border-color:var(--primary-deep);}\n  .btn.ghost{background:transparent;border-style:dashed;color:var(--ink-soft);box-shadow:none;}\n  .btn.know{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct);box-shadow:none;}\n  .btn.know.active{background:var(--correct);color:#fff;border-color:var(--correct);}\n  .btn.again{background:var(--wrong-bg);border-color:var(--wrong-line);color:var(--wrong);box-shadow:none;}\n  .btn.again.active{background:var(--wrong);color:#fff;border-color:var(--wrong);}\n  .btn.full{width:100%;}\n  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}\n  .actions .btn{flex:1;min-width:120px;}\n\n  .flag{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink-faint);\n    background:none;border:none;margin-top:18px;padding:6px 0;transition:.15s;}\n  .flag svg{width:16px;height:16px;}\n  .flag:hover{color:var(--gold);}\n  .flag.on{color:var(--gold);}\n  .flag.on svg{fill:var(--gold);}\n\n  /* ===== BOTTOM NAV ===== */\n  .bottombar{\n    position:sticky;bottom:0;z-index:20;\n    background:color-mix(in srgb, var(--bg) 80%, transparent);\n    backdrop-filter:saturate(1.4) blur(14px);\n    -webkit-backdrop-filter:saturate(1.4) blur(14px);\n    border-top:1px solid var(--line);\n    padding:12px 16px calc(12px + var(--safe-b));\n    display:flex;align-items:center;gap:12px;\n  }\n  .nav-prev{\n    width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;\n    background:var(--card);border:1.5px solid var(--line-strong);color:var(--ink-soft);box-shadow:var(--sh-sm);transition:.16s;\n  }\n  .nav-prev:hover:not(:disabled){color:var(--primary);border-color:#c2bef3;}\n  .nav-prev:active:not(:disabled){transform:scale(.93);}\n  .nav-prev:disabled{opacity:.4;cursor:default;}\n  .nav-prev svg{width:20px;height:20px;}\n  .nav-count{flex:1;text-align:center;font-size:13.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.01em;}\n  .nav-count b{color:var(--ink);font-weight:800;}\n  .nav-next{\n    flex:none;min-width:130px;height:52px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;\n    background:var(--primary);color:#fff;border:1.5px solid var(--primary);font-size:15.5px;font-weight:800;\n    box-shadow:var(--sh-pop);transition:.16s;padding:0 18px;\n  }\n  .nav-next:hover{background:var(--primary-deep);border-color:var(--primary-deep);transform:translateY(-1px);}\n  .nav-next:active{transform:scale(.97);}\n  .nav-next svg{width:18px;height:18px;}\n  .nav-next.is-hidden{display:none;}\n\n  /* ===== SUMMARY ===== */\n  .summary{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);\n    box-shadow:var(--sh-card);padding:30px 24px;text-align:center;animation:rise .42s cubic-bezier(.2,.7,.2,1) both;}\n  .summary .seal{width:60px;height:60px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;\n    background:linear-gradient(140deg,#7b74f0,var(--primary));color:#fff;box-shadow:var(--sh-pop);}\n  .summary .seal svg{width:30px;height:30px;}\n  .summary h2{font-size:25px;font-weight:800;letter-spacing:-.01em;margin:0 0 6px;}\n  .summary .sub{color:var(--ink-soft);font-size:14.5px;margin:0 auto;max-width:340px;line-height:1.5;}\n  .scores{display:flex;justify-content:center;gap:14px;margin:24px 0 6px;}\n  .score{flex:1;max-width:170px;background:var(--primary-soft2);border:1px solid var(--line);border-radius:16px;padding:18px 12px;}\n  .score .big{font-size:34px;font-weight:800;line-height:1;color:var(--primary);letter-spacing:-.02em;}\n  .score .lab{font-size:12px;font-weight:600;color:var(--ink-soft);margin-top:8px;line-height:1.3;}\n  .reviewlist{margin-top:18px;font-size:14px;line-height:1.55;color:var(--ink-soft);\n    background:#fbf4e6;border:1px solid #f0e2bf;border-radius:14px;padding:14px 16px;}\n  .reviewlist.clean{background:var(--correct-bg);border-color:var(--correct-line);color:var(--correct);}\n  .reviewlist b{color:var(--ink);font-weight:800;}\n  .reviewlist.clean b{color:var(--correct);}\n\n  @media (min-width:560px){\n    .scroll{padding:24px 22px 28px;}\n    .card{padding:30px 30px 26px;}\n    .qtext{font-size:22px;}\n  }\n  @media (prefers-reduced-motion:reduce){\n    *{animation-duration:.01ms !important;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"app\">\n  <div class=\"topbar\">\n    <div class=\"topbar-row\">\n      <div class=\"brand\">\n        <span class=\"t\">Герменевтика<\u002Fspan>\n        <span class=\"s\">тренажёр к экзамену<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"tools\">\n        <button class=\"icon-btn\" id=\"shuffleBtn\" title=\"Перемешать вопросы\" aria-label=\"Перемешать\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 3h5v5\"><\u002Fpath><path d=\"M4 20 21 3\"><\u002Fpath><path d=\"M21 16v5h-5\"><\u002Fpath><path d=\"m15 15 6 6\"><\u002Fpath><path d=\"M4 4l5 5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n        <button class=\"icon-btn\" id=\"restartBtn\" title=\"Начать заново\" aria-label=\"Начать заново\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 3-6.7L3 8\"><\u002Fpath><path d=\"M3 3v5h5\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ptrack\"><i id=\"barFill\"><\u002Fi><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"scroll\" id=\"scroll\">\n    <div id=\"stage\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"bottombar\">\n    <button class=\"nav-prev\" id=\"prevBtn\" aria-label=\"Назад\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <div class=\"nav-count\" id=\"navCount\"><\u002Fdiv>\n    <button class=\"nav-next\" id=\"nextBtn\">\n      <span id=\"nextLbl\">Дальше<\u002Fspan>\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m9 18 6-6-6-6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst QUESTIONS = [\n{\n  id:1, type:'mc', typeName:'выбор ответа',\n  q:'Герменевтика — это…',\n  options:[\n    'способность (искусство) находить возможные способы убеждения относительно каждого данного предмета',\n    'наука и искусство толкования текста и всех видов коммуникации',\n    'теория правил лингвистического значения',\n    'всё из вышеперечисленного верно'\n  ],\n  correct:1,\n  expl:'Герменевтика — одновременно наука (система правил и методов) и искусство (требует чутья толкователя). Вариант про «способы убеждения» — это определение риторики (Аристотель), а «теория правил лингвистического значения» слишком узка. Поэтому «всё верно» не подходит.'\n},\n{\n  id:2, type:'mc', typeName:'выбор ответа',\n  q:'КИФ — это…',\n  options:['классификация источников и форм','критика исторических форм','культурно-исторический фон','качественная интерпретация форм'],\n  correct:2,\n  expl:'КИФ — культурно-исторический фон: сведения об эпохе, культуре, политике и быте, в которых создан текст. Без него древний текст читается глазами современного человека и искажается.'\n},\n{\n  id:3, type:'mc', typeName:'выбор ответа',\n  q:'Какое утверждение относится к грамматическому анализу библейского текста?',\n  options:['схематизация всей исследуемой книги','семь пород еврейского глагола','диаграммирование текста','текстуальные разночтения'],\n  correct:1,\n  expl:'Грамматика изучает формы слов. В еврейском глагол имеет систему пород (биньянов) — ок. семи моделей (каль, нифаль, пиэль, пуаль, хифиль, хофаль, хитпаэль). Схематизация книги и диаграммирование — это структура/синтаксис, разночтения — текстуальная критика.'\n},\n{\n  id:4, type:'mc', typeName:'выбор ответа',\n  q:'Какое утверждение относится к каноническому подходу (канонической критике)?',\n  options:[\n    'ставит акцент только на конечной форме текста, преодолевая вопросы фона и авторства',\n    'даёт поздним произведениям доминировать над ранними',\n    'помогает бороться с ересями',\n    'использует множество методов, что затрудняет единую картину'\n  ],\n  correct:0,\n  expl:'Канонический подход (Б. Чайлдс) толкует текст в его итоговой канонической форме, а не гипотетические источники, ранние редакции или вопросы авторства. Фон и предыстория отступают перед признанным общиной Писанием.'\n},\n{\n  id:5, type:'match', typeName:'соответствие',\n  q:'Сопоставьте подходы к толкованию Писания с их определениями.',\n  left:['Доктринальный (традиционный)','Критический (модернистский)','Посткритический (постмодернистский)'],\n  options:[\n    'видит в тексте документ об исторических фактах (с искажениями); текст важен лишь для реконструкции самих фактов',\n    'исследует текст в том виде, в каком он доступен, не реконструируя факты и не задаваясь вопросом о его происхождении',\n    'безоговорочно воспринимает текст как откровение свыше; нуждается в истолковании для сегодняшней ситуации верующих'\n  ],\n  answer:[2,0,1],\n  expl:'Традиционный → откровение свыше. Критический → исторический документ с искажениями. Постмодернистский → текст как есть, без вопроса о происхождении.'\n},\n{\n  id:6, type:'match', typeName:'соответствие',\n  q:'Сопоставьте уровни чтения (по М. Адлеру) с их определениями.',\n  left:['Элементарное чтение','Инспекционное чтение','Синоптическое чтение'],\n  options:[\n    'выявляет основную структуру и главные идеи книги (беглый обзор целого)',\n    'сопоставляет данное послание с другими книгами подобного рода и тщательно анализирует содержание',\n    'определяет особенности отдельных слов и предложений (понимание на уровне фраз)'\n  ],\n  answer:[2,0,1],\n  expl:'От низшего уровня (элементарное — понять слова) к высшему (синоптическое — читать книгу в сравнении с другими).'\n},\n{\n  id:7, type:'match', typeName:'классификация',\n  q:'Отнесите каждый метод к подходу: автор-, текст- или читатель-ориентированному.',\n  left:['Структурализм','Критика источника','Критика теологии освобождения','Риторический критицизм','Критика редакции','Политический критицизм','Социо-исторический критицизм','Феминистический критицизм','Критика нарратива','Афро-американский критицизм'],\n  options:['Автор-ориентированный','Текст-ориентированный','Читатель-ориентированный'],\n  answer:[1,0,2,1,0,2,0,2,1,2],\n  mini:true,\n  expl:'Автор-ориентированные ищут смысл в замысле и истории создания (источник, редакция, социо-исторический). Текст-ориентированные — в самом тексте как системе (структурализм, риторика, нарратив). Читатель-ориентированные — в восприятии общины (теология освобождения, политический, феминистический, афро-американский).'\n},\n{\n  id:8, type:'match', typeName:'соответствие',\n  q:'Сопоставьте внутренние критерии текстуальной критики с их обоснованием.',\n  left:['Более сложный вариант более правдоподобен','Более короткий вариант предпочтительнее','Вариант, соответствующий авторскому стилю и узкому контексту, достовернее'],\n  options:[\n    'учёные используют статистику словоупотребления автора; переписчики меняли текст, подгоняя под своё понимание контекста',\n    'поздние переписчики устраняли «шероховатости» в тексте, а не добавляли их',\n    'чаще материал к тексту добавляли, а не сокращали, поэтому короткий текст вероятнее правилен'\n  ],\n  answer:[1,2,0],\n  expl:'Памятка: переписчики «приглаживали и добавляли». Значит более трудное и более короткое чтение — древнее.'\n},\n{\n  id:9, type:'sequence', typeName:'последовательность',\n  q:'Расставьте этапы принятия грамматических решений по порядку.',\n  items:[\n    'определите, какой вариант больше всего подходит в данном контексте',\n    'проверьте авторское использование слова во всей Библии',\n    'ознакомьтесь с вариантами',\n    'обратитесь за справкой к учебнику по грамматике'\n  ],\n  answer:[2,3,1,0],\n  expl:'Сначала собираем варианты, затем сверяемся с грамматикой и узусом автора, и только потом выбираем по контексту.'\n},\n{\n  id:10, type:'sequence', typeName:'последовательность',\n  q:'Расставьте по порядку принятие критических текстовых решений (греческие рукописи).',\n  items:[\n    'обратить внимание на качество рукописей',\n    'определить даты текстовых источников',\n    'определить генеалогическую связь между рукописями',\n    'определить временные и территориальные рамки рукописей'\n  ],\n  answer:[1,3,2,0],\n  expl:'Датировка источника → географический охват (чтение из многих регионов вероятнее оригинально) → родство рукописей (типы текста) → и в последнюю очередь относительное качество (самый субъективный критерий).'\n},\n{\n  id:11, type:'mc', typeName:'выбор + определение',\n  q:'К какому типу параллелизма относится Пс. 107:4–6?',\n  poem:'«Буду славить Тебя, Господи, между народами; буду воспевать Тебя среди племён…»',\n  options:['синонимический','синтетический','антитетический','хиазм'],\n  correct:0,\n  expl:'Синонимический параллелизм: вторая строка повторяет мысль первой равнозначными словами — «славить»/«воспевать», «народы»/«племена». Новой идеи не вносится, мысль усиливается и дублируется.'\n},\n{\n  id:12, type:'mc', typeName:'выбор + обоснование',\n  q:'Что такое ФПЗ?',\n  options:['фактически понесённые затраты','формы правильных значений','формы переносного значения','формы перевода значения'],\n  correct:2,\n  expl:'ФПЗ — формы переносного значения (метафора, сравнение, метонимия, гипербола, идиома…). Важны: чтобы не впасть в буквализм; чтобы верно передать авторский замысел и силу сказанного; чтобы адекватно перевести древние идиомы.'\n},\n{\n  id:13, type:'fill', typeName:'дополните фразу',\n  q:'Первое, что необходимо сделать при диаграммировании отрывка — распознать ___ и ___ предложения.',\n  inputs:2,\n  accept:[['главн','придаточн'],['независим','зависим']],\n  answer:'главные (независимые) и придаточные (зависимые) предложения',\n  expl:'Структура фразы требует двух прилагательных, согласованных с «предложения», и для разбора отрывка логично сперва различить независимые и зависимые предложения. (Вариант «подлежащее и сказуемое» — это разбор одного предложения по Reed-Kellogg, а не отрывка.)'\n},\n{\n  id:14, type:'fill', typeName:'дополните фразу',\n  q:'Вид параллелизма, при котором вторая половина фразы построена в обратном порядке (А Б В Б′ А′), называется ___.',\n  inputs:1,\n  accept:[['хиазм']],\n  answer:'хиазм (хиастический параллелизм)',\n  expl:'Перекрёстное, зеркальное расположение членов (А-Б-В-Б′-А′), симметрия вокруг центра. Название — от греческой буквы «хи» (Χ).'\n},\n{\n  id:15, type:'open', typeName:'развёрнутый ответ',\n  q:'Почему важно знать и изучать критические подходы? Назовите не менее трёх причин.',\n  model:{intro:'Под критическими подходами понимаются научные методы анализа текста (критика источника, форм, редакции, нарратива и др.).',points:[\n    '<span class=\"strong\">Понимание формирования текста<\u002Fspan> — видеть, какие источники и формы лежат в его основе.',\n    '<span class=\"strong\">Защита от ошибок и манипуляций<\u002Fspan> — критически оценивать выводы учёных, отличать обоснованное от спекулятивного.',\n    '<span class=\"strong\">Диалог с современной наукой<\u002Fspan> — эти методы доминируют в академическом богословии.',\n    '<span class=\"strong\">Полезные инструменты<\u002Fspan> — каждый метод обращает внимание на реальный аспект текста (история, структура, нарратив, риторика).'\n  ]}\n},\n{\n  id:16, type:'open', typeName:'развёрнутый ответ',\n  q:'Назовите как минимум три вида библейского критицизма.',\n  model:{intro:'Достаточно назвать три; ниже несколько с пояснениями:',points:[\n    '<span class=\"strong\">Критика источника<\u002Fspan> — письменные источники в основе текста.',\n    '<span class=\"strong\">Критика форм<\u002Fspan> — малые жанры (притча, гимн, изречение) и их «жизненная ситуация».',\n    '<span class=\"strong\">Критика редакции<\u002Fspan> — как редактор скомпоновал материал, его богословские акценты.',\n    '<span class=\"strong\">Текстуальная критика<\u002Fspan> — сравнение рукописей и разночтений.',\n    '<span class=\"strong\">Нарративная и риторическая<\u002Fspan> — сюжет/персонажи и приёмы убеждения.'\n  ]}\n},\n{\n  id:17, type:'open', typeName:'развёрнутый ответ',\n  q:'Дайте формулировку постструктурализма, его основные тезисы и отличие от структурализма.',\n  model:{intro:'Формулировка: движение, возникшее как критика и преодоление структурализма; отрицает существование замкнутых устойчивых систем и подчёркивает нестабильность и множественность смысла.',points:[\n    '<span class=\"strong\">Смысл не фиксирован<\u002Fspan> — текст поливалентен, значение завершается читателем.',\n    '<span class=\"strong\">Нет универсальной системы знаков<\u002Fspan> — идея всеобъемлющих бинарных оппозиций отвергается.',\n    '<span class=\"strong\">«Свободная игра» означающих<\u002Fspan> (Деррида) — толкование незавершённо, не репрезентативно.',\n    '<span class=\"strong\">Отличие от структурализма:<\u002Fspan> структурализм видит замкнутую систему устойчивых структур и стабильный смысл; постструктурализм отрицает замкнутость, утверждает подвижность смысла и упрекает структурализм в лингвизме, детерминизме и редукционизме.'\n  ]}\n},\n{\n  id:18, type:'open', typeName:'развёрнутый ответ',\n  q:'Назовите три основных компонента герменевтики и кратко объясните каждый.',\n  model:{intro:'Без любого из этих трёх элементов герменевтика невозможна:',points:[\n    '<span class=\"strong\">Текст<\u002Fspan> — то, что подлежит истолкованию; носитель значения в историко-культурном контексте.',\n    '<span class=\"strong\">Автор<\u002Fspan> — вложил в текст замысел и значение; задаёт исходный смысл.',\n    '<span class=\"strong\">Толкователь (читатель)<\u002Fspan> — воспринимает текст и раскрывает смысл, сближая свой «горизонт» с горизонтом текста.',\n    'Именно взаимодействие автора, текста и толкователя образует герменевтический процесс.'\n  ]}\n},\n{\n  id:19, type:'open', typeName:'развёрнутый ответ',\n  q:'Что объединяет феминизм, теологию освобождения и постколониальную теологию с точки зрения герменевтики? Не менее трёх аргументов.',\n  model:{intro:'Все три — разновидности читатель-ориентированной, контекстуальной герменевтики.',points:[\n    '<span class=\"strong\">Контекст важнее текста как норма<\u002Fspan> — нормой становится ситуация конкретной общины, а не сам текст.',\n    '<span class=\"strong\">Тема освобождения угнетённых<\u002Fspan> — социального, гендерного или колониального.',\n    '<span class=\"strong\">Идеологический, ангажированный подход<\u002Fspan> — толкование сознательно ведётся с определённой позиции.',\n    '<span class=\"strong\">Перенос авторитета на читателя<\u002Fspan> — значение определяет современный читатель и его опыт, а не авторский замысел.'\n  ]}\n},\n{\n  id:20, type:'open', typeName:'развёрнутый ответ',\n  q:'Что такое «герменевтическая спираль»?',\n  model:{intro:'Центральный образ книги Г. Осборна. В отличие от «герменевтического круга» (замкнутость: текст через предпонимание, предпонимание через текст), спираль подчёркивает поступательное, восходящее движение к более верному пониманию.',points:[\n    'Толкователь движется <span class=\"strong\">от части к целому и обратно<\u002Fspan>, и при каждом обороте понимание уточняется и поднимается на новый виток.',\n    '<span class=\"strong\">Уровень исходного значения<\u002Fspan> — что текст означал (замысел автора).',\n    '<span class=\"strong\">Уровень значимости<\u002Fspan> — что текст означает для церкви сегодня (контекстуализация, сближение «двух горизонтов»).'\n  ]}\n}\n];\n\nconst LETTERS=['А','Б','В','Г','Д','Е'];\nconst KEY='germ_trener_v2';\nlet order=[], pos=0, status={}, shuffled=false, navDir=null, pendingFB=null;\n\nconst stage=document.getElementById('stage');\nconst scrollEl=document.getElementById('scroll');\nconst barFill=document.getElementById('barFill');\nconst navCount=document.getElementById('navCount');\nconst nextLbl=document.getElementById('nextLbl');\nconst prevBtn=document.getElementById('prevBtn');\nconst nextBtn=document.getElementById('nextBtn');\n\n/* ---- icons ---- */\nconst ICO={\n  check:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/><\u002Fsvg>',\n  x:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18M6 6l12 12\"/><\u002Fsvg>',\n  bulb:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/><path d=\"M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5.76.76 1.23 1.52 1.41 2.5\"/><\u002Fsvg>',\n  flag:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z\"/><path d=\"M4 22v-7\"/><\u002Fsvg>',\n  list:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01\"/><\u002Fsvg>',\n  award:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"8\" r=\"6\"/><path d=\"M15.477 12.89 17 22l-5-3-5 3 1.523-9.11\"/><\u002Fsvg>',\n  finish:'<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 3v18\"/><path d=\"M5 4h14l-3 4 3 4H5\"/><\u002Fsvg>'\n};\nfunction buzz(p){ if(navigator.vibrate){ try{navigator.vibrate(p);}catch(e){} } }\n\n/* ---- persistence ---- */\nfunction persist(){ try{ localStorage.setItem(KEY, JSON.stringify({order,pos,status,shuffled})); }catch(e){} }\nfunction restore(){\n  try{ const d=JSON.parse(localStorage.getItem(KEY));\n    if(d&&Array.isArray(d.order)&&d.order.length===QUESTIONS.length){\n      order=d.order; pos=Math.min(d.pos||0,order.length); status=d.status||{}; shuffled=!!d.shuffled; return true; }\n  }catch(e){}\n  return false;\n}\nfunction shuffleArr(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}\n\nfunction init(fresh){\n  if(!fresh && restore()){ updateShuffleBtn(); render(); return; }\n  order=QUESTIONS.map((_,i)=>i);\n  if(shuffled) order=shuffleArr(order);\n  pos=0; status={}; navDir=null;\n  render();\n}\nfunction updateShuffleBtn(){ document.getElementById('shuffleBtn').classList.toggle('active',shuffled); }\n\nfunction setProgress(){\n  const frac = pos>=order.length ? 1 : pos/order.length;\n  barFill.style.width=(frac*100)+'%';\n  if(pos>=order.length){ navCount.innerHTML='Завершено'; }\n  else{ navCount.innerHTML='Вопрос <b>'+(pos+1)+'<\u002Fb> / '+order.length; }\n}\n\nfunction el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}\n\n/* ---- navigation ---- */\nfunction goNext(){ if(pos<order.length){ navDir='left'; pos++; render(); scrollEl.scrollTop=0; } }\nfunction goPrev(){ if(pos>0){ navDir='right'; pos--; render(); scrollEl.scrollTop=0; } }\n\nfunction render(){\n  if(pos>=order.length){ renderSummary(); setProgress(); updateNav(); persist(); return; }\n  setProgress();\n  const q=QUESTIONS[order[pos]];\n  stage.innerHTML='';\n  const card=el('div','card');\n  if(navDir==='left') card.classList.add('from-left');\n  else if(navDir==='right') card.classList.add('from-right');\n  navDir=null;\n\n  const head=el('div','qhead');\n  const num=el('span','qnum'); num.innerHTML='<span class=\"dot\"><\u002Fspan>Вопрос '+q.id;\n  head.appendChild(num);\n  head.appendChild(el('span','qtype',q.typeName));\n  card.appendChild(head);\n\n  const qt=el('div','qtext'); qt.textContent=q.q;\n  if(q.poem){ qt.appendChild(el('span','poem',q.poem)); }\n  card.appendChild(qt);\n\n  const body=el('div','body');\n  card.appendChild(body);\n  stage.appendChild(card);\n\n  if(q.type==='mc') renderMC(q,body,card);\n  else if(q.type==='match') renderMatch(q,body,card);\n  else if(q.type==='sequence') renderSeq(q,body,card);\n  else if(q.type==='fill') renderFill(q,body,card);\n  else if(q.type==='open') renderOpen(q,body,card);\n\n  renderFlag(q,card);\n\n  // feedback animation\n  if(pendingFB && pendingFB.qid===q.id){\n    card.classList.remove('from-left','from-right');\n    card.classList.add(pendingFB.good?'fb-good':'fb-bad');\n    buzz(pendingFB.good?18:[14,46,14]);\n    pendingFB=null;\n  }\n  updateNav();\n  persist();\n}\n\nfunction updateNav(){\n  const atSummary=pos>=order.length;\n  prevBtn.disabled=pos===0;\n  nextBtn.classList.toggle('is-hidden',atSummary);\n  if(!atSummary){\n    nextLbl.textContent = pos===order.length-1 ? 'Итоги' : 'Дальше';\n  }\n}\n\n/* ---------- MC ---------- */\nfunction renderMC(q,body,card){\n  const done=status[q.id]&&status[q.id].done;\n  q.options.forEach((opt,i)=>{\n    const b=el('button','opt');\n    b.appendChild(el('span','mark',LETTERS[i]));\n    b.appendChild(el('span',null,opt));\n    if(done){\n      b.disabled=true;\n      if(i===q.correct){ b.classList.add('correct'); const r=el('span','res');r.innerHTML=ICO.check;b.appendChild(r); }\n      if(status[q.id].pick===i&&i!==q.correct){ b.classList.add('wrong'); const r=el('span','res');r.innerHTML=ICO.x;b.appendChild(r); }\n    }else{\n      b.onclick=()=>{\n        const good=(i===q.correct);\n        status[q.id]={done:true,pick:i,result:good?'correct':'wrong'};\n        pendingFB={qid:q.id,good};\n        render();\n      };\n    }\n    body.appendChild(b);\n  });\n  if(done) showExpl(q,card,status[q.id].result==='correct');\n}\n\n/* ---------- MATCH / CATEGORIZE ---------- */\nfunction renderMatch(q,body,card){\n  if(!status[q.id] || !status[q.id].sel){ status[q.id]={sel:new Array(q.left.length).fill(-1),done:false}; }\n  const cur=status[q.id];\n  if(!cur.optOrder){ cur.optOrder = (!q.mini) ? shuffleArr(q.options.map((_,i)=>i)) : q.options.map((_,i)=>i); }\n  q.left.forEach((lf,li)=>{\n    const row=el('div','row'+(q.mini?' mini':''));\n    const lab=el('div','lbl');\n    lab.appendChild(el('span','tag',LETTERS[li]));\n    lab.appendChild(document.createTextNode(lf));\n    row.appendChild(lab);\n    const wrap=el('div','selwrap');\n    const sel=document.createElement('select');\n    sel.appendChild(new Option('— выберите —',-1));\n    cur.optOrder.forEach(oi=>{ sel.appendChild(new Option(q.options[oi], oi)); });\n    sel.value=cur.sel[li];\n    sel.disabled=cur.done;\n    sel.onchange=()=>{ cur.sel[li]=parseInt(sel.value); persist(); };\n    if(cur.done){ row.classList.add(cur.sel[li]===q.answer[li]?'ok':'no'); }\n    wrap.appendChild(sel);\n    row.appendChild(wrap);\n    body.appendChild(row);\n  });\n  if(!cur.done){\n    const chk=el('button','btn primary full','Проверить');\n    chk.onclick=()=>{\n      if(!cur.sel.every(v=>v>=0)){ chk.textContent='Заполните все строки'; setTimeout(()=>chk.textContent='Проверить',1200); return; }\n      const ok=cur.sel.every((v,i)=>v===q.answer[i]);\n      cur.done=true; cur.result=ok?'correct':'wrong';\n      pendingFB={qid:q.id,good:ok};\n      render();\n    };\n    body.appendChild(chk);\n  }else{\n    showExpl(q,card,cur.result==='correct');\n  }\n}\n\n/* ---------- SEQUENCE ---------- */\nfunction renderSeq(q,body,card){\n  let st=status[q.id];\n  if(!st){ status[q.id]={pool:shuffleArr(q.items.map((_,i)=>i)),build:[],done:false}; st=status[q.id]; }\n  const hint=el('div','seq-hint');\n  hint.innerHTML=ICO.list+'<span>Нажимайте пункты по порядку — они собираются сверху. Клик по собранному вернёт его вниз.<\u002Fspan>';\n  body.appendChild(hint);\n\n  const buildWrap=el('div','seq-build');\n  st.build.forEach((idx,bi)=>{\n    const c=el('button','chip');\n    if(st.done){ c.classList.add(idx===q.answer[bi]?'ok':'no'); }\n    c.appendChild(el('span','ord',String(bi+1)));\n    c.appendChild(el('span',null,q.items[idx]));\n    if(!st.done){ c.onclick=()=>{ st.build.splice(bi,1); st.pool.push(idx); persist(); render(); }; }\n    buildWrap.appendChild(c);\n  });\n  body.appendChild(buildWrap);\n\n  if(!st.done){\n    if(st.pool.length){\n      const div=el('div','seq-divider'); div.appendChild(el('span',null,'осталось расставить')); body.appendChild(div);\n    }\n    const poolWrap=el('div','seq-pool');\n    st.pool.forEach((idx)=>{\n      const c=el('button','chip pool');\n      c.appendChild(el('span','ord','+'));\n      c.appendChild(el('span',null,q.items[idx]));\n      c.onclick=()=>{ st.build.push(idx); st.pool=st.pool.filter(x=>x!==idx); persist(); render(); };\n      poolWrap.appendChild(c);\n    });\n    body.appendChild(poolWrap);\n    if(st.build.length===q.items.length){\n      const chk=el('button','btn primary full','Проверить порядок');\n      chk.onclick=()=>{\n        const ok=st.build.every((v,i)=>v===q.answer[i]);\n        st.done=true; st.result=ok?'correct':'wrong';\n        pendingFB={qid:q.id,good:ok};\n        render();\n      };\n      body.appendChild(chk);\n    }\n  }else{\n    showExpl(q,card,st.result==='correct',()=>{\n      const co=el('p');\n      co.innerHTML='<span class=\"strong\">Верный порядок:<\u002Fspan> '+q.answer.map((idx,i)=>(i+1)+'. '+q.items[idx]).join('  ·  ');\n      return co;\n    });\n  }\n}\n\n/* ---------- FILL ---------- */\nfunction renderFill(q,body,card){\n  let st=status[q.id];\n  if(!st){ status[q.id]={vals:new Array(q.inputs).fill(''),done:false}; st=status[q.id]; }\n  for(let i=0;i<q.inputs;i++){\n    const inp=document.createElement('input');\n    inp.className='fill-in'; inp.type='text';\n    inp.placeholder=q.inputs>1?('Слово '+(i+1)):'Ваш ответ';\n    inp.value=st.vals[i]; inp.disabled=st.done;\n    if(st.done){ inp.classList.add(st.result==='correct'?'ok':'no'); }\n    inp.oninput=()=>{ st.vals[i]=inp.value; persist(); };\n    inp.onkeydown=(e)=>{ if(e.key==='Enter'&&!st.done){ doCheck(); } };\n    body.appendChild(inp);\n  }\n  function doCheck(){\n    const joined=st.vals.join(' ').toLowerCase();\n    const ok=q.accept.some(grp=>grp.every(kw=>joined.includes(kw)));\n    st.done=true; st.result=ok?'correct':'wrong';\n    pendingFB={qid:q.id,good:ok};\n    render();\n  }\n  if(!st.done){\n    const act=el('div','actions');\n    const chk=el('button','btn primary','Проверить'); chk.onclick=doCheck;\n    const reveal=el('button','btn ghost','Не помню, показать');\n    reveal.onclick=()=>{ st.done=true; st.result='wrong'; pendingFB={qid:q.id,good:false}; render(); };\n    act.appendChild(chk); act.appendChild(reveal);\n    body.appendChild(act);\n  }else{\n    showExpl(q,card,st.result==='correct',()=>{\n      const a=el('p'); a.innerHTML='<span class=\"strong\">Ответ:<\u002Fspan> '+q.answer; return a;\n    });\n  }\n}\n\n/* ---------- OPEN ---------- */\nfunction renderOpen(q,body,card){\n  let st=status[q.id];\n  if(!st){ status[q.id]={revealed:false,rated:null}; st=status[q.id]; }\n  if(!st.revealed){\n    const b=el('button','btn primary full','Показать образец ответа');\n    b.onclick=()=>{ st.revealed=true; render(); };\n    body.appendChild(b);\n  }else{\n    const box=el('div','answerbox');\n    const h=el('h4'); h.innerHTML=ICO.bulb+'Образец ответа'; box.appendChild(h);\n    if(q.model.intro){ const p=el('p'); p.innerHTML=q.model.intro; box.appendChild(p); }\n    const ul=el('ul');\n    q.model.points.forEach(pt=>{ const li=el('li'); li.innerHTML=pt; ul.appendChild(li); });\n    box.appendChild(ul);\n    card.appendChild(box);\n\n    const act=el('div','actions');\n    const know=el('button','btn know','Знал');\n    const again=el('button','btn again','Повторить');\n    if(st.rated==='known')know.classList.add('active');\n    if(st.rated==='review')again.classList.add('active');\n    know.onclick=()=>{ st.rated='known'; buzz(18); render(); };\n    again.onclick=()=>{ st.rated='review'; buzz(12); render(); };\n    act.appendChild(know); act.appendChild(again);\n    card.appendChild(act);\n  }\n}\n\n/* ---------- shared ---------- */\nfunction showExpl(q,card,good,extraFn){\n  const v=el('div','verdict '+(good?'good':'bad'));\n  const ico=el('span','vico'); ico.innerHTML=good?ICO.check:ICO.x;\n  v.appendChild(ico);\n  v.appendChild(document.createTextNode(good?'Верно':'Неверно'));\n  card.appendChild(v);\n  const box=el('div','answerbox');\n  const h=el('h4'); h.innerHTML=ICO.bulb+'Пояснение'; box.appendChild(h);\n  if(extraFn){ const ex=extraFn(); if(ex)box.appendChild(ex); }\n  const p=el('p'); p.textContent=q.expl; box.appendChild(p);\n  card.appendChild(box);\n}\n\nfunction renderFlag(q,card){\n  const flagged=status['flag_'+q.id];\n  const flag=el('button','flag'+(flagged?' on':''));\n  flag.innerHTML=ICO.flag+'<span>'+(flagged?'В списке повторения':'Отметить к повторению')+'<\u002Fspan>';\n  flag.onclick=()=>{ status['flag_'+q.id]=!flagged; persist(); render(); };\n  card.appendChild(flag);\n}\n\n/* ---------- SUMMARY ---------- */\nfunction renderSummary(){\n  let autoTotal=0,autoCorrect=0,openKnown=0,openTotal=0,toReview=[];\n  QUESTIONS.forEach(q=>{\n    const st=status[q.id];\n    if(['mc','match','sequence','fill'].includes(q.type)){\n      autoTotal++;\n      if(st&&st.result==='correct')autoCorrect++;\n      else if(st&&st.result==='wrong')toReview.push(q.id);\n    }else if(q.type==='open'){\n      openTotal++;\n      if(st&&st.rated==='known')openKnown++;\n      else if(st&&st.rated==='review')toReview.push(q.id);\n    }\n    if(status['flag_'+q.id]&&!toReview.includes(q.id))toReview.push(q.id);\n  });\n  toReview.sort((a,b)=>a-b);\n  stage.innerHTML='';\n  const s=el('div','summary');\n  const seal=el('div','seal'); seal.innerHTML=ICO.award; s.appendChild(seal);\n  s.appendChild(el('h2','Круг пройден'));\n  s.appendChild(el('p','sub','Спираль делает виток. Повторите отмеченное и пройдите снова — с каждым разом понимание поднимается на ступень выше.'));\n\n  const sc=el('div','scores');\n  const a=el('div','score'); a.innerHTML='<div class=\"big\">'+autoCorrect+'/'+autoTotal+'<\u002Fdiv><div class=\"lab\">закрытые задания<\u002Fdiv>';\n  const o=el('div','score'); o.innerHTML='<div class=\"big\">'+openKnown+'/'+openTotal+'<\u002Fdiv><div class=\"lab\">развёрнутые «знал»<\u002Fdiv>';\n  sc.appendChild(a); sc.appendChild(o); s.appendChild(sc);\n\n  const rev=el('div','reviewlist'+(toReview.length?'':' clean'));\n  rev.innerHTML = toReview.length\n    ? '<b>К повторению:<\u002Fb> вопросы № '+toReview.join(', ')+'.'\n    : '<b>Отлично — ничего не отмечено к повторению.<\u002Fb>';\n  s.appendChild(rev);\n\n  const act=el('div','actions');\n  const again=el('button','btn primary','Пройти заново'); again.onclick=()=>init(true);\n  const sh=el('button','btn','Перемешать и пройти');\n  sh.onclick=()=>{ shuffled=true; updateShuffleBtn(); init(true); };\n  act.appendChild(again); act.appendChild(sh);\n  s.appendChild(act);\n  stage.appendChild(s);\n}\n\n/* ---------- toolbar ---------- */\ndocument.getElementById('shuffleBtn').onclick=function(){\n  shuffled=!shuffled; updateShuffleBtn(); init(true);\n};\ndocument.getElementById('restartBtn').onclick=()=>{ if(confirm('Начать заново? Прогресс будет сброшен.')) init(true); };\nprevBtn.onclick=goPrev;\nnextBtn.onclick=goNext;\n\n/* ---------- swipe ---------- */\nlet tX=null,tY=null,sw=false;\nscrollEl.addEventListener('touchstart',e=>{\n  if(e.touches.length!==1){ tX=null; return; }\n  if(e.target.closest('select,input,textarea')){ tX=null; return; }\n  tX=e.touches[0].clientX; tY=e.touches[0].clientY; sw=false;\n},{passive:true});\nscrollEl.addEventListener('touchmove',e=>{\n  if(tX==null)return;\n  const dx=e.touches[0].clientX-tX, dy=e.touches[0].clientY-tY;\n  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>14) sw=true;\n},{passive:true});\nscrollEl.addEventListener('touchend',e=>{\n  if(tX==null)return;\n  const dx=e.changedTouches[0].clientX-tX, dy=e.changedTouches[0].clientY-tY;\n  tX=null;\n  if(sw&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){ if(dx<0)goNext(); else goPrev(); }\n});\n/* keyboard */\ndocument.addEventListener('keydown',e=>{\n  if(e.target.closest('input,select,textarea'))return;\n  if(e.key==='ArrowRight')goNext();\n  else if(e.key==='ArrowLeft')goPrev();\n});\n\ninit();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
