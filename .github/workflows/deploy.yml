name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # ручной запуск из вкладки Actions

env:
  REGISTRY: ghcr.io
  WEBAPP_IMAGE: ghcr.io/art-app/trainer-webapp
  BOT_IMAGE: ghcr.io/art-app/trainer-bot

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # нужно для push в GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Логин в Docker Hub — снимает rate limit на тягу базовых образов (nginx/python).
      # Нужны secrets DOCKERHUB_USERNAME и DOCKERHUB_TOKEN; без них шаг пропускается.
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push webapp
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          push: true
          tags: |
            ${{ env.WEBAPP_IMAGE }}:latest
            ${{ env.WEBAPP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=webapp
          cache-to: type=gha,scope=webapp,mode=max

      - name: Build & push bot
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          push: true
          tags: |
            ${{ env.BOT_IMAGE }}:latest
            ${{ env.BOT_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,scope=bot,mode=max

  deploy:
    name: Deploy on server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH → pull & up
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            docker compose pull
            docker compose up -d
            docker image prune -f
