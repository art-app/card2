name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bot — проверка синтаксиса
        run: python3 -m py_compile bot/bot.py

      - name: docker compose config (валидация)
        run: |
          cp .env.example .env
          docker compose config >/dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Сборка webapp (без push)
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          push: false

      - name: Сборка bot (без push)
        uses: docker/build-push-action@v6
        with:
          context: ./bot
          push: false
