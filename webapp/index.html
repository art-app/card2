<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Герменевтика · тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    --sys:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  }
  html,body{height:100%;}

  /* ===== theme tokens (overridden by Telegram themeParams at runtime) ===== */
  body.tg-light{
    --page:#efeff4; --section:#ffffff; --text:#000000; --text2:#3c3c43; --hint:#8e8e93;
    --separator:rgba(60,60,67,.16); --line:rgba(60,60,67,.12);
    --accent:#2481cc; --accent-text:#ffffff; --accent-soft:rgba(36,129,204,.12); --accent-deep:#1f6fb2;
    --green:#34a853; --green-soft:rgba(52,168,83,.14); --green-line:rgba(52,168,83,.4);
    --red:#e0533d; --red-soft:rgba(224,83,61,.12); --red-line:rgba(224,83,61,.4);
    --field:#ffffff; --field-bd:rgba(60,60,67,.22); --chip:#f1f1f6; --section2:#f7f7fb;
    --barbg:#dadbe3;
  }
  body.tg-dark{
    --page:#17181b; --section:#242529; --text:#ffffff; --text2:#ebebf2; --hint:#8a8a92;
    --separator:rgba(255,255,255,.12); --line:rgba(255,255,255,.08);
    --accent:#8774e1; --accent-text:#ffffff; --accent-soft:rgba(135,116,225,.2); --accent-deep:#7563cf;
    --green:#30d158; --green-soft:rgba(48,209,88,.16); --green-line:rgba(48,209,88,.4);
    --red:#ff6a52; --red-soft:rgba(255,106,82,.16); --red-line:rgba(255,106,82,.4);
    --field:#2d2e33; --field-bd:rgba(255,255,255,.13); --chip:#2d2e33; --section2:#2a2b30;
    --barbg:#3a3b41;
  }

  body{
    font-family:var(--ui);
    background:var(--page);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  ::selection{background:var(--accent-soft);}

  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;}
  #wv{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));}
  #wv::-webkit-scrollbar{display:none;}

  /* ===== progress strip ===== */
  .pstrip{display:flex;align-items:center;gap:12px;margin-bottom:15px;}
  .pstrip .bar{flex:1;height:6px;border-radius:99px;background:var(--barbg);overflow:hidden;}
  .pstrip .bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s cubic-bezier(.4,0,.1,1);}
  .pstrip .ct{font-size:12.5px;font-weight:700;color:var(--hint);flex:none;font-variant-numeric:tabular-nums;}
  .pstrip .ct b{color:var(--text);}

  /* ===== card ===== */
  .card{background:var(--section);border-radius:18px;padding:16px 14px 15px;box-shadow:0 1px 2px rgba(0,0,0,.05);
    animation:rise .38s cubic-bezier(.2,.7,.2,1) both;}
  body.tg-dark .card{box-shadow:none;border:1px solid var(--line);}
  @keyframes rise{from{transform:translateY(12px);}to{transform:none;}}
  .card.from-left{animation:slideL .3s cubic-bezier(.2,.7,.2,1) both;}
  .card.from-right{animation:slideR .3s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes slideL{from{transform:translateX(34px);}to{transform:none;}}
  @keyframes slideR{from{transform:translateX(-34px);}to{transform:none;}}
  @keyframes pop{0%{transform:scale(.99);}45%{transform:scale(1.01);}100%{transform:scale(1);}}
  @keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(4px);}30%,50%,70%{transform:translateX(-7px);}40%,60%{transform:translateX(7px);}}
  .card.fb-good{animation:pop .42s ease;}
  .card.fb-bad{animation:shake .5s cubic-bezier(.36,.07,.19,.97);}

  .qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .qnum{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.02em;}
  .qnum .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
  .qtype{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--hint);
    background:var(--chip);border-radius:99px;padding:5px 10px;white-space:nowrap;}
  .qtext{font-size:18px;line-height:1.34;font-weight:700;letter-spacing:-.01em;color:var(--text);margin-bottom:15px;text-wrap:pretty;}
  .qtext .poem{display:block;font-size:14.5px;font-weight:500;font-style:italic;color:var(--text2);
    margin-top:12px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 9px 9px 0;padding:11px 13px;}

  /* ===== MC options ===== */
  .opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
    border:1.5px solid var(--field-bd);background:var(--section);border-radius:13px;
    padding:13px 13px;margin-bottom:9px;font-size:15px;font-weight:500;line-height:1.35;color:var(--text);
    min-height:54px;transition:.15s ease;}
  .opt:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft);}
  .opt:not(:disabled):active{transform:scale(.99);}
  .opt .mark{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
    font-size:13px;font-weight:800;color:var(--accent);background:var(--accent-soft);transition:.15s;}
  .opt .res{margin-left:auto;flex:none;}
  .opt .res svg{width:18px;height:18px;}
  .opt.correct{border-color:var(--green-line);background:var(--green-soft);}
  .opt.wrong{border-color:var(--red-line);background:var(--red-soft);}
  .opt.correct .mark{background:var(--green);color:#fff;}
  .opt.wrong .mark{background:var(--red);color:#fff;}
  .opt.correct .res{color:var(--green);}
  .opt.wrong .res{color:var(--red);}
  .opt:disabled{cursor:default;}

  /* ===== verdict + answerbox (discoverability fix) ===== */
  .verdict{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14.5px;
    margin:16px 0 0;padding:8px 14px 8px 9px;border-radius:99px;animation:vin .32s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes vin{from{transform:scale(.85);}to{transform:none;}}
  .verdict.good{color:var(--green);background:var(--green-soft);}
  .verdict.bad{color:var(--red);background:var(--red-soft);}
  .verdict .vico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;}
  .verdict.good .vico{background:var(--green);}
  .verdict.bad .vico{background:var(--red);}
  .verdict .vico svg{width:13px;height:13px;}

  .answerbox{margin-top:12px;background:var(--section2);border:1px solid var(--line);
    border-radius:14px;padding:13px 14px;box-shadow:0 0 0 3px var(--accent-soft);scroll-margin:80px;}
  .answerbox.flash{animation:flash 1.6s ease-in-out 1;}
  @keyframes flash{0%,100%{box-shadow:0 0 0 3px var(--accent-soft);}45%{box-shadow:0 0 0 4px var(--accent);}}
  .answerbox h4{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase;color:var(--accent);}
  .answerbox h4 svg{width:14px;height:14px;}
  .answerbox p{font-size:14px;line-height:1.55;color:var(--text2);margin-bottom:7px;}
  .answerbox p:last-child{margin-bottom:0;}
  .answerbox ul{list-style:none;margin-top:7px;}
  .answerbox li{font-size:14px;line-height:1.5;color:var(--text2);padding-left:18px;position:relative;margin-bottom:8px;}
  .answerbox li:last-child{margin-bottom:0;}
  .answerbox li::before{content:"";position:absolute;left:3px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.7;}
  .answerbox .strong{color:var(--text);font-weight:700;}

  /* ===== match / categorize ===== */
  .row{margin-bottom:13px;}
  .row .lbl{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:7px;line-height:1.35;}
  .row .lbl .tag{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
    font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-soft);margin-top:1px;}
  .sel{position:relative;}
  .sel select{width:100%;font-family:inherit;font-size:14px;font-weight:500;color:var(--text);background:var(--field);
    border:1.5px solid var(--field-bd);border-radius:12px;padding:13px 34px 13px 13px;min-height:50px;
    appearance:none;-webkit-appearance:none;line-height:1.3;transition:.15s;}
  .sel select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .sel::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;
    border-right:2px solid var(--hint);border-bottom:2px solid var(--hint);transform:translateY(-65%) rotate(45deg);pointer-events:none;}
  .row.ok select{border-color:var(--green-line);background:var(--green-soft);}
  .row.no select{border-color:var(--red-line);background:var(--red-soft);}

  /* ===== sequence ===== */
  .seqhint{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text2);margin-bottom:13px;line-height:1.4;}
  .seqhint svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--accent);}
  .chip{display:flex;gap:12px;align-items:center;border:1.5px solid var(--field-bd);background:var(--section);
    border-radius:12px;padding:13px 13px;font-size:14.5px;font-weight:500;color:var(--text);width:100%;text-align:left;
    line-height:1.35;margin-bottom:9px;min-height:54px;transition:.15s;}
  .chip:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft);}
  .chip:not(:disabled):active{transform:scale(.99);}
  .chip .ord{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
    font-size:14px;font-weight:800;color:#fff;background:var(--accent);}
  .chip.pool .ord{background:var(--accent-soft);color:var(--accent);font-size:18px;}
  .chip.ok{border-color:var(--green-line);background:var(--green-soft);}
  .chip.no{border-color:var(--red-line);background:var(--red-soft);}
  .chip.ok .ord{background:var(--green);}
  .chip.no .ord{background:var(--red);}
  .seqdiv{height:1px;background:var(--separator);margin:6px 0 18px;position:relative;}
  .seqdiv span{position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:var(--section);
    padding:0 10px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--hint);white-space:nowrap;}

  /* ===== fill ===== */
  .fill-in{width:100%;font-family:inherit;background:var(--field);border:1.5px solid var(--field-bd);border-radius:12px;
    padding:14px 14px;font-size:15px;font-weight:600;color:var(--text);min-height:52px;margin-bottom:9px;transition:.15s;}
  .fill-in::placeholder{color:var(--hint);font-weight:400;}
  .fill-in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .fill-in.ok{border-color:var(--green-line);background:var(--green-soft);}
  .fill-in.no{border-color:var(--red-line);background:var(--red-soft);}
  .ghostbtn{width:100%;border:1.5px dashed var(--field-bd);background:transparent;color:var(--hint);
    border-radius:12px;padding:12px;font-size:13.5px;font-weight:700;margin-top:2px;}
  .ghostbtn:active{transform:scale(.99);}

  /* ===== open self-rate ===== */
  .rate{display:flex;gap:9px;margin-top:13px;}
  .rate .rb{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border-radius:12px;padding:12px;font-size:14px;font-weight:700;border:1.5px solid;}
  .rate .rb svg{width:15px;height:15px;}
  .rate .know{color:var(--green);border-color:var(--green-line);background:var(--green-soft);}
  .rate .again{color:var(--red);border-color:var(--red-line);background:var(--red-soft);}
  .rate .know.active{background:var(--green);color:#fff;}
  .rate .again.active{background:var(--red);color:#fff;}

  /* ===== flag ===== */
  .flag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--hint);margin-top:14px;padding:4px 0;}
  .flag svg{width:15px;height:15px;}
  .flag.on{color:var(--accent);}
  .flag.on svg{fill:var(--accent-soft);}

  /* ===== start ===== */
  .start{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 8px 0;}
  .applogo{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;margin-bottom:16px;
    background:linear-gradient(145deg,var(--accent),var(--accent-deep));}
  .applogo svg{width:40px;height:40px;}
  .start h3{font-size:23px;font-weight:800;letter-spacing:-.01em;color:var(--text);}
  .start .tag{font-size:13.5px;font-weight:500;color:var(--hint);margin-top:4px;}
  .start .desc{font-size:14px;line-height:1.55;color:var(--text2);margin-top:14px;max-width:300px;}
  .stats{display:flex;gap:9px;margin-top:20px;width:100%;}
  .stats .s{flex:1;background:var(--section);border:1px solid var(--line);border-radius:14px;padding:14px 6px;}
  .stats .s .n{font-size:20px;font-weight:800;color:var(--accent);line-height:1;}
  .stats .s .l{font-size:11px;font-weight:600;color:var(--hint);margin-top:6px;line-height:1.25;}
  .resume{margin-top:14px;width:100%;background:var(--accent-soft);border-radius:14px;padding:12px 14px;
    display:flex;align-items:center;gap:11px;text-align:left;}
  .resume .ri{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;background:var(--accent);color:#fff;}
  .resume .ri svg{width:16px;height:16px;}
  .resume .rt{font-size:13px;font-weight:700;color:var(--text);line-height:1.2;}
  .resume .rs{font-size:11px;color:var(--hint);margin-top:2px;}
  .startctrls{display:flex;gap:9px;margin-top:16px;width:100%;}
  .startctrls .sb{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:1.5px solid var(--field-bd);background:var(--section);border-radius:12px;padding:12px;
    font-size:13px;font-weight:700;color:var(--text2);}
  .startctrls .sb svg{width:15px;height:15px;}
  .startctrls .sb.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}

  /* ===== summary ===== */
  .summary{text-align:center;padding:18px 6px 0;animation:rise .4s cubic-bezier(.2,.7,.2,1) both;}
  .summary .seal{width:62px;height:62px;border-radius:18px;margin:6px auto 14px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--accent),var(--accent-deep));color:#fff;}
  .summary .seal svg{width:32px;height:32px;}
  .summary h3{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.01em;}
  .summary .sub{font-size:13.5px;line-height:1.5;color:var(--text2);margin:7px auto 0;max-width:300px;}
  .scores{display:flex;gap:10px;margin:20px 0 0;}
  .scores .sc{flex:1;background:var(--section);border:1px solid var(--line);border-radius:15px;padding:16px 8px;}
  .scores .sc .big{font-size:28px;font-weight:800;color:var(--accent);line-height:1;letter-spacing:-.02em;}
  .scores .sc .lab{font-size:11px;font-weight:600;color:var(--hint);margin-top:8px;line-height:1.25;}
  .reviewl{margin-top:14px;font-size:13px;line-height:1.5;text-align:left;
    background:var(--red-soft);border:1px solid var(--red-line);border-radius:13px;padding:12px 14px;color:var(--text2);}
  .reviewl.clean{background:var(--green-soft);border-color:var(--green-line);color:var(--green);}
  .reviewl b{color:var(--text);font-weight:800;}
  .reviewl.clean b{color:var(--green);}

  /* ===== fallback MainButton bar (browser, outside Telegram) ===== */
  .mbtn{flex:none;display:flex;gap:10px;align-items:center;padding:9px 12px calc(10px + env(safe-area-inset-bottom,0px));
    background:var(--page);border-top:1px solid var(--separator);}
  .mbtn .navback{width:48px;height:48px;flex:none;border-radius:12px;display:grid;place-items:center;
    background:var(--section);border:1.5px solid var(--field-bd);color:var(--text2);}
  .mbtn .navback svg{width:20px;height:20px;}
  .mbtn .b{flex:1;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:var(--accent-text);font-size:15.5px;font-weight:700;font-family:var(--sys);}
  .mbtn .b:disabled{background:var(--barbg);color:var(--hint);}
  .mbtn[hidden]{display:none;}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;}}
</style>
</head>
<body class="tg-light">
<div id="app">
  <div id="wv"><div id="stage"></div></div>
</div>

<script>
/* ================= data ================= */
const QUESTIONS = [
{ id:1, type:'mc', typeName:'выбор ответа', q:'Герменевтика — это…',
  options:['способность (искусство) находить возможные способы убеждения относительно каждого данного предмета','наука и искусство толкования текста и всех видов коммуникации','теория правил лингвистического значения','всё из вышеперечисленного верно'],
  correct:1, expl:'Герменевтика — одновременно наука (система правил и методов) и искусство (требует чутья толкователя). Вариант про «способы убеждения» — это определение риторики (Аристотель), а «теория правил лингвистического значения» слишком узка. Поэтому «всё верно» не подходит.'},
{ id:2, type:'mc', typeName:'выбор ответа', q:'КИФ — это…',
  options:['классификация источников и форм','критика исторических форм','культурно-исторический фон','качественная интерпретация форм'],
  correct:2, expl:'КИФ — культурно-исторический фон: сведения об эпохе, культуре, политике и быте, в которых создан текст. Без него древний текст читается глазами современного человека и искажается.'},
{ id:3, type:'mc', typeName:'выбор ответа', q:'Какое утверждение относится к грамматическому анализу библейского текста?',
  options:['схематизация всей исследуемой книги','семь пород еврейского глагола','диаграммирование текста','текстуальные разночтения'],
  correct:1, expl:'Грамматика изучает формы слов. В еврейском глагол имеет систему пород (биньянов) — ок. семи моделей (каль, нифаль, пиэль, пуаль, хифиль, хофаль, хитпаэль). Схематизация книги и диаграммирование — это структура/синтаксис, разночтения — текстуальная критика.'},
{ id:4, type:'mc', typeName:'выбор ответа', q:'Какое утверждение относится к каноническому подходу (канонической критике)?',
  options:['ставит акцент только на конечной форме текста, преодолевая вопросы фона и авторства','даёт поздним произведениям доминировать над ранними','помогает бороться с ересями','использует множество методов, что затрудняет единую картину'],
  correct:0, expl:'Канонический подход (Б. Чайлдс) толкует текст в его итоговой канонической форме, а не гипотетические источники, ранние редакции или вопросы авторства. Фон и предыстория отступают перед признанным общиной Писанием.'},
{ id:5, type:'match', typeName:'соответствие', q:'Сопоставьте подходы к толкованию Писания с их определениями.',

function applyTheme(){
  scheme = inTG ? (TG.colorScheme||'light') : (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.body.className = scheme==='dark'?'tg-dark':'tg-light';
  const root=document.documentElement;
  ['--page','--section','--section2','--text','--text2','--hint','--separator','--line','--accent','--accent-text','--chip','--field'].forEach(v=>root.style.removeProperty(v));
  if(inTG && TG.themeParams){
    const t=TG.themeParams, set=(v,val)=>{ if(val) root.style.setProperty(v,val); };
    set('--page',t.bg_color); set('--section',t.section_bg_color||t.secondary_bg_color);
    set('--section2',t.secondary_bg_color||t.section_bg_color); set('--text',t.text_color);
    set('--text2',t.subtitle_text_color||t.text_color); set('--hint',t.hint_color);
    set('--separator',t.section_separator_color); set('--line',t.section_separator_color);
    set('--chip',t.secondary_bg_color); set('--field',t.section_bg_color||t.bg_color);
    if(t.button_color){ if(scheme==='dark') accentDark=t.button_color; else accentLight=t.button_color; set('--accent',t.button_color); }
    if(t.button_text_color) set('--accent-text',t.button_text_color);
  }
  if(inTG){
    try{
      const pg=getComputedStyle(document.body).getPropertyValue('--page').trim()||(scheme==='dark'?'#17181b':'#efeff4');
      if(TG.setBackgroundColor) TG.setBackgroundColor(pg);
      if(TG.setHeaderColor) TG.setHeaderColor(pg);
    }catch(e){}
  }
}

/* ================= state ================= */
let order=[], pos=0, status={}, shuffled=false, view='start', navDir=null, pendingFB=null, lastBox=null;
const stage=document.getElementById('stage');
const wv=document.getElementById('wv');
const cur=()=>QUESTIONS[order[pos]];

function persist(){
  const payload=JSON.stringify({order,pos,status,shuffled});
  try{ localStorage.setItem(KEY,payload); }catch(e){}
  if(CS){ try{ CS.setItem(KEY,payload,function(){}); }catch(e){} }
}
function restore(){
  try{ const d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.order)&&d.order.length===QUESTIONS.length){
      order=d.order; pos=Math.min(d.pos||0,order.length); status=d.status||{}; shuffled=!!d.shuffled; return true; }
  }catch(e){}
  return false;
}
function shuffleArr(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}

function hasProgress(){ return order.length===QUESTIONS.length && (pos>0 || Object.keys(status).length>0) && pos<order.length; }

function init(fresh){
  if(fresh){
    order=QUESTIONS.map((_,i)=>i); if(shuffled) order=shuffleArr(order);
    pos=0; status={}; navDir=null; view='quiz'; persist(); render(); return;
  }
  if(!restore()){ order=QUESTIONS.map((_,i)=>i); if(shuffled) order=shuffleArr(order); pos=0; status={}; }
  navDir=null; renderStart();
}

    '<h3>Герменевтика</h3>'+
    '<div class="tag">тренажёр к экзамену</div>'+
    '<p class="desc">15 вопросов в форматах: тесты, соответствия, последовательности и развёрнутые ответы. С каждым витком спирали понимание поднимается выше.</p>'+
    '<div class="stats"><div class="s"><div class="n">14</div><div class="l">вопросов</div></div>'+
    '<div class="s"><div class="n">6</div><div class="l">форматов</div></div>'+
    '<div class="s"><div class="n">~15</div><div class="l">минут</div></div></div>';
  if(hasProgress()){
    const r=el('div','resume');
    r.innerHTML='<div class="ri">'+ICO.resume+'</div><div><div class="rt">Продолжить с вопроса '+(pos+1)+'</div><div class="rs">пройдено '+Math.round(pos/order.length*100)+'% курса</div></div>';
    wrap.appendChild(r);
  }
  const ctrls=el('div','startctrls');
  const sh=el('button','sb'+(shuffled?' on':'')); sh.innerHTML=ICO.shuffle+'<span>Перемешать</span>';
  sh.onclick=()=>{ shuffled=!shuffled; order=QUESTIONS.map((_,i)=>i); if(shuffled)order=shuffleArr(order); pos=0; status={}; persist(); renderStart(); };
  ctrls.appendChild(sh);
  if(hasProgress()){
    const rs=el('button','sb'); rs.innerHTML=ICO.resume+'<span>Сбросить</span>';
    rs.onclick=()=>{ order=QUESTIONS.map((_,i)=>i); if(shuffled)order=shuffleArr(order); pos=0; status={}; persist(); renderStart(); };
    ctrls.appendChild(rs);
  }
  wrap.appendChild(ctrls);
  stage.appendChild(wrap);
  wv.scrollTop=0;
  Nav.hideBack();
  Nav.setMain(hasProgress()?'Продолжить':'Начать',{onClick:()=>{ view='quiz'; render(); }});
}

/* ================= navigation ================= */
function goNext(){ if(pos<order.length){ navDir='left'; pos++; render(); wv.scrollTop=0; } }
function goPrev(){ if(pos>0){ navDir='right'; pos--; render(); wv.scrollTop=0; } }
function onBack(){ if(view!=='quiz'){ return; } if(pos>0) goPrev(); else renderStart(); }
backAction=onBack;

/* ================= main render ================= */
function progressStrip(){
  const frac=pos>=order.length?1:pos/order.length;
  const s=el('div','pstrip');
  s.innerHTML='<span class="ct">Вопрос <b>'+(Math.min(pos+1,order.length))+'</b> / '+order.length+'</span><div class="bar"><i style="width:'+(frac*100)+'%"></i></div>';
  return s;
}
function render(){
  if(view==='start'){ renderStart(); return; }
  if(pos>=order.length){ renderSummary(); return; }
  Nav.showBack();
  stage.innerHTML='';
  stage.appendChild(progressStrip());
  const q=cur();
  const card=el('div','card');
  if(navDir==='left') card.classList.add('from-left');
  else if(navDir==='right') card.classList.add('from-right');
  navDir=null;

  const head=el('div','qhead');
  const num=el('span','qnum'); num.innerHTML='<span class="dot"></span>Вопрос '+q.id;
  head.appendChild(num); head.appendChild(el('span','qtype',q.typeName));
  card.appendChild(head);

  const qt=el('div','qtext'); qt.textContent=q.q;
  if(q.poem) qt.appendChild(el('span','poem',q.poem));
  card.appendChild(qt);

  const body=el('div'); card.appendChild(body);
  stage.appendChild(card);

  if(q.type==='mc') renderMC(q,body,card);
  else if(q.type==='match') renderMatch(q,body,card);
  else if(q.type==='sequence') renderSeq(q,body,card);
  else if(q.type==='fill') renderFill(q,body,card);
  else if(q.type==='open') renderOpen(q,body,card);

  renderFlag(q,card);

  if(pendingFB && pendingFB.qid===q.id){
    card.classList.remove('from-left','from-right');
    card.classList.add(pendingFB.good?'fb-good':'fb-bad');
    Nav.haptic(pendingFB.good);
    if(lastBox){ lastBox.classList.add('flash'); const b=lastBox; requestAnimationFrame(()=>setTimeout(()=>b.scrollIntoView({behavior:'smooth',block:'center'}),60)); }
    pendingFB=null;
  }
  syncMain();
  persist();
}

function advance(){ goNext(); }
function advLabel(){ return pos===order.length-1?'Завершить':'Дальше'; }

function syncMain(){
  if(view==='start'){ return; }
  if(pos>=order.length){ Nav.setMain('Пройти заново',{onClick:()=>init(true)}); return; }
  const q=cur(), st=status[q.id]||{};
  if(q.type==='mc'){
    if(st.done) Nav.setMain(advLabel(),{onClick:advance}); else Nav.hideMain();
  }else if(q.type==='match'){
    if(st.done) Nav.setMain(advLabel(),{onClick:advance});
    else Nav.setMain('Проверить',{enabled:!!st.sel&&st.sel.every(v=>v>=0),onClick:checkMatch});
  }else if(q.type==='sequence'){
    if(st.done) Nav.setMain(advLabel(),{onClick:advance});
    else Nav.setMain('Проверить порядок',{enabled:!!st.build&&st.build.length===q.items.length,onClick:checkSeq});
  }else if(q.type==='fill'){
    if(st.done) Nav.setMain(advLabel(),{onClick:advance});
    else Nav.setMain('Проверить',{enabled:!!st.vals&&st.vals.every(v=>v.trim()!==''),onClick:checkFill});
  }else if(q.type==='open'){
    if(st.revealed) Nav.setMain(advLabel(),{onClick:advance});
    else Nav.setMain('Показать образец',{onClick:()=>{ (status[q.id]||(status[q.id]={})).revealed=true; render(); }});
  }
}

/* ================= MC ================= */
function renderMC(q,body,card){
  const done=status[q.id]&&status[q.id].done;
  q.options.forEach((opt,i)=>{
    const b=el('button','opt');
    b.appendChild(el('span','mark',LETTERS[i]));
    b.appendChild(el('span',null,opt));
    if(done){
      b.disabled=true;
      if(i===q.correct){ b.classList.add('correct'); const r=el('span','res'); r.innerHTML=ICO.check; b.appendChild(r); }
      if(status[q.id].pick===i&&i!==q.correct){ b.classList.add('wrong'); const r=el('span','res'); r.innerHTML=ICO.x; b.appendChild(r); }
    }else{
      b.onclick=()=>{ const good=(i===q.correct); status[q.id]={done:true,pick:i,result:good?'correct':'wrong'}; pendingFB={qid:q.id,good}; render(); };
    }
    body.appendChild(b);
  });
  if(done) showExpl(q,card,status[q.id].result==='correct');
}

/* ================= MATCH ================= */
function renderMatch(q,body,card){
  if(!status[q.id]||!status[q.id].sel) status[q.id]={sel:new Array(q.left.length).fill(-1),done:false};
  const cur=status[q.id];
  if(!cur.optOrder) cur.optOrder = (!q.mini)?shuffleArr(q.options.map((_,i)=>i)):q.options.map((_,i)=>i);
  q.left.forEach((lf,li)=>{
    const row=el('div','row');
    const lab=el('div','lbl'); lab.appendChild(el('span','tag',LETTERS[li])); lab.appendChild(document.createTextNode(lf));
    row.appendChild(lab);
    const wrap=el('div','sel');
    const sel=document.createElement('select');
    sel.appendChild(new Option('— выберите —',-1));
    cur.optOrder.forEach(oi=>sel.appendChild(new Option(q.options[oi],oi)));
    sel.value=cur.sel[li]; sel.disabled=cur.done;
    sel.onchange=()=>{ cur.sel[li]=parseInt(sel.value); persist(); syncMain(); };
    if(cur.done) row.classList.add(cur.sel[li]===q.answer[li]?'ok':'no');
    wrap.appendChild(sel); row.appendChild(wrap); body.appendChild(row);
  });
  if(cur.done) showExpl(q,card,cur.result==='correct');
}
function checkMatch(){ const q=cur(),st=status[q.id]; const ok=st.sel.every((v,i)=>v===q.answer[i]); st.done=true; st.result=ok?'correct':'wrong'; pendingFB={qid:q.id,good:ok}; render(); }

/* ================= SEQUENCE ================= */
function renderSeq(q,body,card){
  let st=status[q.id];
  if(!st){ status[q.id]={pool:shuffleArr(q.items.map((_,i)=>i)),build:[],done:false}; st=status[q.id]; }
  const hint=el('div','seqhint'); hint.innerHTML=ICO.list+'<span>Нажимайте пункты по порядку — они собираются сверху. Клик по собранному вернёт его вниз.</span>';
  body.appendChild(hint);
  st.build.forEach((idx,bi)=>{
    const c=el('button','chip');
    if(st.done) c.classList.add(idx===q.answer[bi]?'ok':'no');
    c.appendChild(el('span','ord',String(bi+1)));
    c.appendChild(el('span',null,q.items[idx]));
    if(!st.done) c.onclick=()=>{ st.build.splice(bi,1); st.pool.push(idx); persist(); render(); };
    else c.disabled=true;
    body.appendChild(c);
  });
  if(!st.done){
    if(st.pool.length){ const div=el('div','seqdiv'); div.appendChild(el('span',null,'осталось расставить')); body.appendChild(div); }
    st.pool.forEach(idx=>{
      const c=el('button','chip pool');
      c.appendChild(el('span','ord','+')); c.appendChild(el('span',null,q.items[idx]));
      c.onclick=()=>{ st.build.push(idx); st.pool=st.pool.filter(x=>x!==idx); persist(); render(); };
      body.appendChild(c);
    });
  }else{
    showExpl(q,card,st.result==='correct',()=>{ const p=el('p'); p.innerHTML='<span class="strong">Верный порядок:</span> '+q.answer.map((idx,i)=>(i+1)+'. '+q.items[idx]).join('  ·  '); return p; });
  }
}
function checkSeq(){ const q=cur(),st=status[q.id]; const ok=st.build.every((v,i)=>v===q.answer[i]); st.done=true; st.result=ok?'correct':'wrong'; pendingFB={qid:q.id,good:ok}; render(); }

/* ================= FILL ================= */
function renderFill(q,body,card){
  let st=status[q.id];
  if(!st){ status[q.id]={vals:new Array(q.inputs).fill(''),done:false}; st=status[q.id]; }
  for(let i=0;i<q.inputs;i++){
    const inp=document.createElement('input'); inp.className='fill-in'; inp.type='text';
    inp.placeholder=q.inputs>1?('Слово '+(i+1)):'Ваш ответ';
    inp.value=st.vals[i]; inp.disabled=st.done;
    if(st.done) inp.classList.add(st.result==='correct'?'ok':'no');
    inp.oninput=()=>{ st.vals[i]=inp.value; persist(); syncMain(); };
    inp.onkeydown=(e)=>{ if(e.key==='Enter'&&!st.done&&st.vals.every(v=>v.trim()!=='')) checkFill(); };
    body.appendChild(inp);
  }
  if(!st.done){
    const rev=el('button','ghostbtn','Не помню, показать ответ');
    rev.onclick=()=>{ st.done=true; st.result='wrong'; pendingFB={qid:q.id,good:false}; render(); };
    body.appendChild(rev);
  }else{
    showExpl(q,card,st.result==='correct',()=>{ const a=el('p'); a.innerHTML='<span class="strong">Ответ:</span> '+q.answer; return a; });
  }
}
function checkFill(){ const q=cur(),st=status[q.id]; const joined=st.vals.join(' ').toLowerCase(); const ok=q.accept.some(grp=>grp.every(kw=>joined.includes(kw))); st.done=true; st.result=ok?'correct':'wrong'; pendingFB={qid:q.id,good:ok}; render(); }

/* ================= OPEN ================= */
function renderOpen(q,body,card){
  let st=status[q.id];
  if(!st){ status[q.id]={revealed:false,rated:null}; st=status[q.id]; }
  if(!st.revealed){
    const ph=el('p'); ph.style.cssText='font-size:14px;line-height:1.55;color:var(--hint);';
    ph.textContent='Сформулируйте ответ мысленно или на бумаге, затем откройте образец и оцените себя.';
    body.appendChild(ph);
    return;
  }
  const box=el('div','answerbox');
  const h=el('h4'); h.innerHTML=ICO.bulb+'Образец ответа'; box.appendChild(h);
  if(q.model.intro){ const p=el('p'); p.innerHTML=q.model.intro; box.appendChild(p); }
  const ul=el('ul'); q.model.points.forEach(pt=>{ const li=el('li'); li.innerHTML=pt; ul.appendChild(li); }); box.appendChild(ul);
  card.appendChild(box); lastBox=box;
  const rate=el('div','rate');
  const know=el('button','rb know'); know.innerHTML=ICO.check+'Знал';
  const again=el('button','rb again'); again.innerHTML=ICO.resume+'Повторить';
  if(st.rated==='known')know.classList.add('active');
  if(st.rated==='review')again.classList.add('active');
  know.onclick=()=>{ st.rated='known'; Nav.haptic(true); render(); };
  again.onclick=()=>{ st.rated='review'; Nav.haptic(false); render(); };
  rate.appendChild(know); rate.appendChild(again); card.appendChild(rate);
}

/* ================= shared ================= */
function showExpl(q,card,good,extraFn){
  const v=el('div','verdict '+(good?'good':'bad'));
  const ico=el('span','vico'); ico.innerHTML=good?ICO.check:ICO.x; v.appendChild(ico);
  v.appendChild(document.createTextNode(good?'Верно':'Неверно')); card.appendChild(v);
  const box=el('div','answerbox');
  const h=el('h4'); h.innerHTML=ICO.bulb+'Пояснение'; box.appendChild(h);
  if(extraFn){ const ex=extraFn(); if(ex)box.appendChild(ex); }
  const p=el('p'); p.textContent=q.expl; box.appendChild(p);
  card.appendChild(box); lastBox=box;
}
function renderFlag(q,card){
  const flagged=status['flag_'+q.id];
  const flag=el('button','flag'+(flagged?' on':''));
  flag.innerHTML=ICO.flag+'<span>'+(flagged?'В списке повторения':'Отметить к повторению')+'</span>';
  flag.onclick=()=>{ status['flag_'+q.id]=!flagged; persist(); render(); };
  card.appendChild(flag);
}

/* ================= SUMMARY ================= */
function renderSummary(){
  view='quiz'; Nav.showBack();
  let autoTotal=0,autoCorrect=0,openKnown=0,openTotal=0,toReview=[];
  QUESTIONS.forEach(q=>{
    const st=status[q.id];
    if(['mc','match','sequence','fill'].includes(q.type)){
      autoTotal++;
      if(st&&st.result==='correct')autoCorrect++;
      else if(st&&st.result==='wrong')toReview.push(q.id);
    }else if(q.type==='open'){
      openTotal++;
      if(st&&st.rated==='known')openKnown++;
      else if(st&&st.rated==='review')toReview.push(q.id);
    }
    if(status['flag_'+q.id]&&!toReview.includes(q.id))toReview.push(q.id);
  });
  toReview.sort((a,b)=>a-b);
  stage.innerHTML='';
  const s=el('div','summary');
  const seal=el('div','seal'); seal.innerHTML=ICO.award; s.appendChild(seal);
  s.appendChild(el('h3','Круг пройден'));
  s.appendChild(el('p','sub','Спираль делает виток. Повторите отмеченное и пройдите снова — понимание поднимается на ступень выше.'));
  const sc=el('div','scores');
  const a=el('div','sc'); a.innerHTML='<div class="big">'+autoCorrect+'/'+autoTotal+'</div><div class="lab">закрытые задания</div>';
  const o=el('div','sc'); o.innerHTML='<div class="big">'+openKnown+'/'+openTotal+'</div><div class="lab">развёрнутые «знал»</div>';
  sc.appendChild(a); sc.appendChild(o); s.appendChild(sc);
  const rev=el('div','reviewl'+(toReview.length?'':' clean'));
  rev.innerHTML = toReview.length ? '<b>К повторению:</b> вопросы № '+toReview.join(', ')+'.' : '<b>Отлично — ничего не отмечено к повторению.</b>';
  s.appendChild(rev);
  stage.appendChild(s);
  wv.scrollTop=0;
  Nav.setMain('Пройти заново',{onClick:()=>init(true)});
  persist();
}

/* ================= gestures ================= */
let tX=null,tY=null,sw=false;
wv.addEventListener('touchstart',e=>{
  if(view!=='quiz'||pos>=order.length||e.touches.length!==1||e.target.closest('select,input,textarea')){ tX=null; return; }
  tX=e.touches[0].clientX; tY=e.touches[0].clientY; sw=false;
},{passive:true});
wv.addEventListener('touchmove',e=>{ if(tX==null)return; const dx=e.touches[0].clientX-tX,dy=e.touches[0].clientY-tY; if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>14)sw=true; },{passive:true});
wv.addEventListener('touchend',e=>{ if(tX==null)return; const dx=e.changedTouches[0].clientX-tX,dy=e.changedTouches[0].clientY-tY; tX=null; if(sw&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.4){ if(dx<0)goNext(); else goPrev(); } });
document.addEventListener('keydown',e=>{ if(view!=='quiz'||e.target.closest('input,select,textarea'))return; if(e.key==='ArrowRight')goNext(); else if(e.key==='ArrowLeft')goPrev(); });

/* ================= boot ================= */
function startApp(){
  if(inTG){
    TG.ready(); try{TG.expand();}catch(e){}
    try{ if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }catch(e){}
    try{ TG.MainButton.onClick(()=>mainAction()); }catch(e){}
    try{ TG.BackButton.onClick(()=>backAction()); }catch(e){}
    try{ TG.onEvent('themeChanged',applyTheme); }catch(e){}
  }else{
    buildFallbackBar();
    if(window.matchMedia) matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
  }
  applyTheme();
  init();
}

if(CS){
  // Hydrate localStorage from CloudStorage (cross-device) before first render.
  let settled=false;
  const go=()=>{ if(!settled){ settled=true; startApp(); } };
  try{
    CS.getItem(KEY,function(err,val){
      if(!err && val){ try{ localStorage.setItem(KEY,val); }catch(e){} }
      go();
    });
    setTimeout(go,1500); // fallback if CloudStorage never calls back
  }catch(e){ startApp(); }
}else{
  startApp();
}
</script>
