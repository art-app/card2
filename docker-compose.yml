services:
  webapp:
    build: ./webapp
    image: trener-webapp
    container_name: trener-webapp
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK}"
      # HTTPS-роутер
      - "traefik.http.routers.trener.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.trener.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.trener.tls=true"
      - "traefik.http.routers.trener.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.trener.loadbalancer.server.port=80"

  bot:
    build: ./bot
    image: trener-bot
    container_name: trener-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - WEBAPP_URL=https://${DOMAIN}/
    depends_on:
      - webapp

networks:
  # Внешняя сеть, которую слушает Traefik (создаётся не этим compose).
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK}
